# HexaSend Nginx Configuration for hexasend.com
# Updated with Production SSL, streaming optimizations, and canonical www→non-www redirect

# ── Canonical HTTPS server (non-www only) ───────────────────────────────────
server {
    server_name hexasend.com;

    # Note: Security headers are set by Helmet in the Node.js app.
    # Do not duplicate them here to avoid conflicting values.

    # Increase client max body size for file uploads
    client_max_body_size 1G;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for real-time file streaming (CRITICAL for production)
        proxy_buffering off;
        proxy_request_buffering off;

        # Increased timeouts for large file transfers (up to 1GB)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Handle WebSocket connections for file transfers
    location /ws {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Consistent timeouts for WebSockets
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hexasend.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hexasend.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── www HTTPS → redirect to non-www ─────────────────────────────────────────
server {
    server_name www.hexasend.com;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hexasend.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hexasend.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Permanent canonical redirect: www → non-www
    return 301 https://hexasend.com$request_uri;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name hexasend.com www.hexasend.com;
    return 301 https://hexasend.com$request_uri;
}